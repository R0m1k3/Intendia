# Intendia next to an existing Hermes Agent stack. Copy to docker-compose.yml and adapt the
# three external names (workspace volume, Hermes network, reverse-proxy network).
services:
  intendia:
    image: ghcr.io/r0m1k3/intendia:0.0      # development versions (0.0.x); from 1.0, use the major alias :1
    container_name: intendia
    restart: unless-stopped
    init: true
    user: "${PUID:-10000}:${PGID:-10000}"   # must be able to write the Hermes workspace volume
    env_file: .env
    volumes:
      - intendia-data:/data
      - workspace:/workspace
    networks: [hermes, proxy]
    # No published ports: your reverse proxy reaches intendia:3000 on the "proxy" network.
    # Port 3001 (MCP, tool share_file) must stay reachable from the Hermes network only: Hermes calls
    # http://intendia:3001/mcp/<instance-id> with the token shown in Settings (see docs/install.md).
    # Never add "3001:3001" under ports.
    expose: ["3000", "3001"]
    logging:
      options: { max-size: "10m", max-file: "3" }
    # labels:
    #   - com.centurylinklabs.watchtower.enable=true   # only if Watchtower runs with --label-enable

volumes:
  intendia-data:
  workspace:
    name: hermes_workspace          # the volume your Hermes containers use as workspace
    external: true

networks:
  hermes:
    name: hermes_default            # the network of your Hermes stack
    external: true
  proxy:
    name: proxy                     # the network of your reverse proxy (NPM, Caddy, Traefik...)
    external: true
