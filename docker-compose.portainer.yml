# Portainer stack (Repository mode): builds Intendia from this repository and runs it next to an
# existing Hermes stack. Compose path in Portainer: docker-compose.portainer.yml
#
# Stack environment variables (set them in Portainer, never in this file):
#   INTENDIA_SECRET          optional, openssl rand -hex 32 (empty: generated into the data volume)
#   INTENDIA_PUBLIC_URL      optional, e.g. https://intendia.example.com
#   INTENDIA_PASSWORD_HASH   optional, $argon2id$... (empty: installation code in the logs)
#   INTENDIA_HOST_PORT       optional, host port of the web UI (default 3012)
#   PUID / PGID              optional, owner of the data volume (default 1000:1000)
# No shared volume: workspace files go through each Hermes dashboard (HERMES_DASHBOARD_FILES_ROOT, docs/install.md).
services:
  # One-shot: the image creates /data for uid 10000; give the named volume to PUID:PGID.
  intendia-perms:
    image: alpine:3.20
    command: ["sh", "-c", "chown -R ${PUID:-1000}:${PGID:-1000} /data"]
    volumes:
      - intendia-data:/data
    restart: "no"

  intendia:
    build:
      context: .
      args:
        VERSION: git
    image: intendia:local
    # Local image only: never pulled (Portainer's "re-pull image" would fail), rebuilt on each deploy.
    pull_policy: build
    container_name: intendia
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      intendia-perms:
        condition: service_completed_successfully
    # INTENDIA_SECRET left empty: generated once into the data volume and reused on every start.
    command:
      - sh
      - -c
      - |
        if [ -z "$$INTENDIA_SECRET" ]; then
          umask 077
          [ -s /data/.intendia-secret ] || node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))" > /data/.intendia-secret
          export INTENDIA_SECRET="$$(cat /data/.intendia-secret)"
        fi
        exec node /app/dist/index.js
    environment:
      INTENDIA_SECRET: ${INTENDIA_SECRET:-}
      INTENDIA_PUBLIC_URL: ${INTENDIA_PUBLIC_URL:-}
      INTENDIA_PASSWORD_HASH: ${INTENDIA_PASSWORD_HASH:-}
      INTENDIA_WEBHOOK_URL: ${INTENDIA_WEBHOOK_URL:-}
      INTENDIA_UPLOAD_MAX_MB: ${INTENDIA_UPLOAD_MAX_MB:-100}
    volumes:
      - intendia-data:/data
    networks:
      - nginx_default
    # Web UI only. Port 3001 (MCP share_file) stays on the Docker network: Hermes calls
    # http://intendia:3001/mcp/<instance-id>. Never publish 3001.
    ports:
      - "${INTENDIA_HOST_PORT:-3012}:3000"
    expose: ["3001"]
    logging:
      options: { max-size: "10m", max-file: "3" }

volumes:
  intendia-data:

networks:
  nginx_default:
    external: true
