name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., push: false, load: true, tags: 'intendia:ci' }
      # installation as in docs/install.md, against fake-hermes on the host
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Start fake-hermes
        run: |
          mkdir -p /tmp/fake-files
          (cd apps/fake-hermes && FAKE_FILES_ROOT=/tmp/fake-files nohup pnpm dev > /tmp/fake.log 2>&1 &)
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:18642/health && break; sleep 1; done
      - name: Install and check
        run: .github/scripts/install-smoke.sh
        env: { FAKE_FILES_ROOT: /tmp/fake-files }
  # the repo build against the official Hermes image of the newest fixtures (pinned: a new Hermes release never
  # turns an unrelated PR red; `latest` is checked weekly by hermes-compat.yml)
  real-hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_KEY: ci-api-key-0123456789abcdef
      DASH_TOKEN: ci-dashboard-token-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm build
      - id: ver
        run: echo "v=$(ls fixtures | grep '^hermes-' | sed 's/^hermes-//' | sort -V | tail -1)" >> "$GITHUB_OUTPUT"
      - run: .github/scripts/start-hermes.sh nousresearch/hermes-agent:v${{ steps.ver.outputs.v }}
      - run: .github/scripts/real-hermes-smoke.sh
        env: { EXPECT_VERSION: '${{ steps.ver.outputs.v }}' }
      - if: always()
        run: docker logs hermes-gw 2>&1 | tail -40; docker logs hermes-dash 2>&1 | tail -20; tail -60 /tmp/intendia.log 2>/dev/null || true
