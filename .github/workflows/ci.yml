name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., push: false, load: true, tags: 'intendia:ci' }
      # installation as in docs/install.md, against fake-hermes on the host
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Start fake-hermes
        run: |
          mkdir -p /tmp/fake-files
          (cd apps/fake-hermes && FAKE_FILES_ROOT=/tmp/fake-files nohup pnpm dev > /tmp/fake.log 2>&1 &)
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:18642/health && break; sleep 1; done
      - name: Install and check
        run: .github/scripts/install-smoke.sh
        env: { FAKE_FILES_ROOT: /tmp/fake-files }
