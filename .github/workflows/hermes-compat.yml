# Weekly early warning: starts the official Hermes image (latest), without any AI provider key, records its
# read-only answers with `probe`, compares them with the newest recorded fixtures (removals and status / type
# changes only: additions are notes), and runs the smoke checks of the repo build against it. Opens an issue on
# a degraded module, a change or a failed smoke; closes the open ones when everything is clean again.
name: Hermes compatibility
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency: { group: hermes-compat, cancel-in-progress: false }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_KEY: ci-api-key-0123456789abcdef
      DASH_TOKEN: ci-dashboard-token-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Start Hermes latest (gateway + dashboard)
        run: .github/scripts/start-hermes.sh nousresearch/hermes-agent:latest
      - name: Record and compare
        id: probe
        run: |
          set -o pipefail
          previous=$GITHUB_WORKSPACE/$(ls -d fixtures/hermes-* | sort -V | tail -1)
          code=0
          PROBE_API=http://127.0.0.1:8642 PROBE_API_KEY=$API_KEY \
          PROBE_DASH=http://127.0.0.1:9119 PROBE_DASH_TOKEN=$DASH_TOKEN \
            pnpm probe record --out /tmp/latest --strict 2>&1 | tee /tmp/record.txt || code=$?
          # tsx directly: pnpm turns every non-zero exit code into 1, and 4 (= changes) must stay 4
          dcode=0; apps/server/node_modules/.bin/tsx apps/server/src/cli/probe.ts diff "$previous" /tmp/latest > /tmp/diff.txt 2>&1 || dcode=$?; cat /tmp/diff.txt
          cp /tmp/diff.txt /tmp/latest/diff.txt
          version=$(node -e "console.log(require('/tmp/latest/surface.json').version)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$dcode" != 0 ] && [ "$dcode" != 4 ]; then echo "probe diff failed ($dcode)"; exit "$dcode"; fi
          if [ "$code" != 0 ] || [ "$dcode" = 4 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: hermes-latest-recording, path: /tmp/latest }
      - name: Smoke against latest
        id: smoke
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm build
          .github/scripts/real-hermes-smoke.sh 2>&1 | tee /tmp/smoke.txt
      - name: Open an issue
        if: steps.probe.outputs.changed == 'true' || steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          title="Hermes ${{ steps.probe.outputs.version }}: API changes detected"
          if gh issue list --state open --search "$title in:title" --json number --jq 'length' | grep -q '^0$'; then
            { echo '`probe` against `nousresearch/hermes-agent:latest`. Recording attached to the workflow run.'; echo; \
              echo '### Modules'; echo '```'; tail -12 /tmp/record.txt; echo '```'; \
              echo '### Diff with the newest fixtures'; echo '```'; head -c 50000 /tmp/diff.txt; echo; echo '```'; \
              [ "$(wc -c < /tmp/diff.txt)" -gt 50000 ] && echo "Diff cut at 50 kB: full text in the run's artifact (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."; \
              echo '### Smoke against latest'; \
              if [ "$SMOKE" = success ]; then echo 'passed'; else echo '```'; tail -60 /tmp/smoke.txt 2>/dev/null; echo '```'; fi; } > /tmp/body.md
            new=$(gh issue create --title "$title" --body-file /tmp/body.md)
            # one open issue at a time: the newest release holds the whole diff against the fixtures
            gh issue list --state open --search "API changes detected in:title" --json number,url --jq '.[] | "\(.number) \(.url)"' | while read -r n url; do
              [ "$url" = "$new" ] && continue
              gh issue comment "$n" --body "Replaced by $new (newer Hermes release, same comparison against the fixtures)."
              gh issue close "$n"
            done
          fi
      - name: Close stale issues
        if: steps.probe.outputs.changed != 'true' && steps.smoke.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue list --state open --search "API changes detected in:title" --json number --jq '.[].number' | while read -r n; do
            gh issue comment "$n" --body "No change against the newest fixtures on $(date -u +%F) (run $URL)."
            gh issue close "$n"
          done
      - name: Fail on a failed smoke
        if: steps.smoke.outcome == 'failure'
        run: exit 1
      - if: always()
        run: docker logs hermes-gw 2>&1 | tail -40; docker logs hermes-dash 2>&1 | tail -20; tail -60 /tmp/intendia.log 2>/dev/null || true
